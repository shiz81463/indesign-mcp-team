name: Package release ZIP
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.4.1-team.1
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest and create ZIP
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: python3 scripts/make-release.py
      - name: Upload deployment archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/indesign-mcp-team-$RELEASE_TAG.zip" "$RUNNER_TEMP/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --clobber
